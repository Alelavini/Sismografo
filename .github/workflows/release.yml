name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Publicar ejecutable para Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test RedSismica.sln -c Release
      - name: Publicar .exe autocontenido (no requiere instalar .NET)
        run: >
          dotnet publish src/RedSismica/RedSismica.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish
      - name: Empaquetar
        run: Compress-Archive -Path publish/RedSismica.exe -DestinationPath RedSismica-win-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: RedSismica-win-x64.zip
          generate_release_notes: true
